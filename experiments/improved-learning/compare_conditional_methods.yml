# Compares the available conditional-probability synthesis methods against each
# other. Only the lsharp_monitor configuration is run (ToVer's L#, i.e. with
# don't cares and the reference language); the single swept dimension is
# conditional_method.
#
# conditional_method values come from tover.core.synthesis.ConditionalMethod:
#   rejection, restart, bisection, bisection_advanced,
#   bisection_pt, bisection_advanced_pt, policy_iteration
#
# `zip` couples conditional_method with use_exact (see ObjectGroup): rejection and
# restart run with exact arithmetic, the bisection family runs with floats. Each
# bundle crosses its own list-valued keys, so the block below expands to six
# method/precision variants (defined once via the &methods anchor, reused below).

- type: LearningExperiment
  name: icy-driving
  file:
    - experiments/icy-driving/icy-driving.pm
  parameters:
    - constants: "IMAX=25"
    # - constants: "IMAX=50"
  horizon:
    - 10
    - 25
  spec: Pmax=? [F<=1 "crash"]
  loader: pomdp
  learning_method: lsharp_monitor
  seed: &seeds [0,1,2]
  zip: &methods
    - conditional_method: [rejection, restart]
      use_exact: true
    - conditional_method: [bisection, bisection_advanced, bisection_pt, bisection_advanced_pt]
      use_exact: false

- type: LearningExperiment
  name: refuel
  file:
    - experiments/premise/refuel.nm
    - experiments/premise/refuelB.nm
  parameters:
    - constants: "N=3,ENERGY=3"
    # - constants: "N=4,ENERGY=3"
    # - constants: "N=3,ENERGY=4"
  spec: Pmax=? [F<=3 "empty"]
  loader: pomdp
  learning_method: lsharp_monitor
  seed: *seeds
  zip: *methods

