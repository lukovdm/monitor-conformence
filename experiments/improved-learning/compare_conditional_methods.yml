# Compares the available conditional-probability synthesis methods against each
# other. Only the lsharp_dc_rl configuration is run (L#, use_dont_care=true,
# use_refrence_language=true); the single swept dimension is conditional_method.
#
# conditional_method values come from tover.core.synthesis.ConditionalMethod:
#   rejection, restart, bisection, bisection_advanced,
#   bisection_pt, bisection_advanced_pt, policy_iteration

- type: LearningExperiment
  name: icy-driving
  file:
    - experiments/icy-driving/icy-driving.pm
  parameters:
    - constants: "IMAX=25"
    # - constants: "IMAX=50"
  horizon:
    - 10
    - 25
  spec: Pmax=? [F<=1 "crash"]
  good_label: crash
  loader: pomdp
  use_exact: &exact false
  learning_method: lsharp
  use_dont_care: true
  use_refrence_language: true
  conditional_method: &cmethods
    - rejection
    - restart
    - bisection
    - bisection_advanced
    - bisection_pt
    - bisection_advanced_pt

- type: LearningExperiment
  name: refuel
  file:
    - experiments/premise/refuel.nm
    - experiments/premise/refuelB.nm
  parameters:
    - constants: "N=3,ENERGY=3"
    # - constants: "N=4,ENERGY=3"
    # - constants: "N=3,ENERGY=4"
  spec: Pmax=? [F<=3 "empty"]
  good_label: empty
  loader: pomdp
  use_exact: *exact
  learning_method: lsharp
  use_dont_care: true
  use_refrence_language: true
  conditional_method: *cmethods

