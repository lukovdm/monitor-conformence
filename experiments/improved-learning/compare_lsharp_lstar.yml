# Compares L* against L# (with/without don't-care and reference language).
# The first experiment (icy-driving) carries the shared configuration via the
# &base anchor; every other benchmark merges it with `<<: *base` and overrides
# only the benchmark-specific keys (name/file/parameters/spec/good_label/horizon).
# Locally specified keys win over the merged ones.

- &base
  type: LearningExperiment
  name: icy-driving
  file:
    - experiments/icy-driving/icy-driving.pm
  parameters:
    - constants: "IMAX=25"
    - constants: "IMAX=50"
  horizon:
    # - 10
    - 20
  spec: Pmax=? [F<=1 "crash"]
  good_label: crash
  loader: pomdp
  use_exact: false
  learning_method:
    - lstar
    - lsharp
  zip:
    - use_dont_care: true
      use_refrence_language: true
    - use_dont_care: false
      use_refrence_language: false
  seed: [0,1,2]
  full_testing: true
  random_eq_method:
    - max_seqs: 50000

- <<: *base
  name: refuel
  file:
    - experiments/premise/refuel.nm
    - experiments/premise/refuelB.nm
  parameters:
    - constants: "N=3,ENERGY=3"
    - constants: "N=4,ENERGY=3"
    - constants: "N=3,ENERGY=4"
  horizon: 10  # the base sets a horizon, so pin refuel to its default explicitly
  spec: Pmax=? [F<=3 "empty"]
  good_label: empty
  full_testing: false

- <<: *base
  name: evade
  file: experiments/premise/evade-monitoring.nm
  parameters:
    constants: "N=4,RADIUS=2"
  spec: Pmax=? [F<=4 "crash"]
  good_label: crash
  full_testing: false
  horizon:
    - 7
    - 9

- <<: *base
  name: hidden_incentive
  file: experiments/premise/hidden-incentive.nm
  parameters:
    constants: "N=3"
  spec: Pmax=? [F<=4 "crash"]
  good_label: crash
  full_testing: false
  horizon:
    - 8
    - 10

- <<: *base
  name: airport
  file:
    - experiments/premise/airportA-3.nm
    - experiments/premise/airportB-7.nm
  parameters:
    - constants: "DMAX=3,PMAX=3"
    - constants: "DMAX=4,PMAX=4"
  spec: Pmax=? [F<=4 "crash"]
  good_label: crash
  full_testing: false
  horizon:
    - 9
    - 11

- <<: *base
  name: snakes_ladders
  loader: snakes_ladders
  file: experiments/mc_u_nxn.pm
  parameters:
    n: 100
    ladders:
      1: 38
      4: 14
      9: 31
      28: 64
      40: 42
      36: 44
      51: 67
      71: 91
      80: 100
    snakes:
      98: 76
      95: 75
      93: 73
      87: 24
      64: 60
      62: 19
      55: 53
      49: 11
      47: 26
      16: 6
  spec: Pmax=? [F<5 "good"]
  good_label: good
  full_testing: true
  horizon:
    # - 8
    - 10
    - 12
    - 14
    - 16
    # - 18
