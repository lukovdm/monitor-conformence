- type: LearningExperiment
  name: icy-driving
  file:
    - experiments/icy-driving/icy-driving.pm
  parameters:
    - constants: "IMAX=25"
    # - constants: "IMAX=50"
  horizon:
    - 10
    - 25
  spec: Pmax=? [F<=1 "crash"]
  loader: pomdp
  learning_method: lsharp_monitor
  seed: &seeds [0,1,2]
  random_eq_method: &methods
    - max_seqs: 5000
    - max_seqs: 50000
    - max_seqs: 500000

- type: LearningExperiment
  name: refuel
  file:
    - experiments/premise/refuel.nm
    - experiments/premise/refuelB.nm
  parameters:
    - constants: "N=3,ENERGY=3"
    # - constants: "N=4,ENERGY=3"
    # - constants: "N=3,ENERGY=4"
  spec: Pmax=? [F<=3 "empty"]
  loader: pomdp
  learning_method: lsharp_monitor
